name: HRMax-dev

services:
  hrmax-redis-dev:
    image: redis:latest
    container_name: hrmax_redis_dev
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - hrmax_redis_data:/data
    networks:
      - hrmax_network

  hrmax-postgres-dev:
    image: postgres:latest
    container_name: hrmax_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRE_DB}
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
    ports:
      - "${POSTGRE_PORT}:5432"
    env_file:
      - .env
    volumes:
      - hrmax_postgre_data:/var/lib/postgresql/data
    networks:
      - hrmax_network

networks:
  hrmax_network:

volumes:
  hrmax_redis_data:
  hrmax_postgre_data:
